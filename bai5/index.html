<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bai 5</title>
    <style>
        /* loại 2: internal style  */
        h2{
            /* color dùng để quy định màu chữ */
            color: red;
        }
        #tieuDe{
            color:orange; 
        }
        .tieuDe2{
            color:aquamarine;
        }
    </style>
    <link rel="stylesheet" href="style.css" type="text/css">
</head>
<body>
    <!-- I các kiểu viết style trong html  -->
    <!-- kieu 1 viet style trong the -->
     <!-- loại 1: Inline style  -->
     <h1 style="color: blue">HUMG</h1>
     <!-- kieu 2 viết ngoài thẻ-->
    <h2>Trường đại học Mỏ địa chất</h2>

    <h3>lớp phát triển ứng dụng web 03</h3>
    <!-- II.selector -->
    <!-- cách 1 dùng tên thẻ -->

    <!-- cách 2: dùng id -->
     <h2 id="tieuDe">Trường đại học mỏ địa chất</h2>
    <!-- cách 3: dùng class(viết dấu . trước tên class) -->
    <h2 id="tieuDe" class="tieuDe"> Trường đại học Mỏ địa chất</h2>

    <h3 class="tieuDe2">lớp phát triển ứng dụng web</h3>

    margin padding
</body>
</html>
